# Proprietary NetIQ/OpenText jars in lib/ and a locally installed dirxml-simulator
# are required to compile. They are not in this repository and the simulator is
# not on Maven Central, so there is no profile that runs the suite without them.
# bin/require-engine.sh fails this job with setup steps before Maven can report
# a missing systemPath or an unresolved com.pointblue.dirxml:dirxml-simulator artifact.

name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Require engine jars and simulator
        run: bash bin/require-engine.sh

      - name: Test
        run: mvn -B test
